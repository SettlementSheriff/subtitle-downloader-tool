<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151233"/>
      <stop offset="1" stop-color="#241a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37e6d0"/>
      <stop offset="1" stop-color="#4fb0ff"/>
    </linearGradient>
    <linearGradient id="barFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37e6d0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#37e6d0" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37e6d0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#37e6d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filmStrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2350"/>
      <stop offset="1" stop-color="#1a1638"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="960" cy="120" r="260" fill="url(#glow)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="60" r="2"/>
    <circle cx="140" cy="60" r="2"/>
    <circle cx="200" cy="60" r="2"/>
    <circle cx="80" cy="300" r="2"/>
    <circle cx="140" cy="300" r="2"/>
    <circle cx="200" cy="300" r="2"/>
    <circle cx="1080" cy="300" r="2"/>
    <circle cx="1020" cy="300" r="2"/>
  </g>

  <!-- film strip on right side -->
  <g>
    <rect x="960" y="0" width="240" height="360" fill="url(#filmStrip)" opacity="0.6"/>
    <g fill="#0b1020" opacity="0.8">
      <rect x="975" y="20" width="26" height="18" rx="3"/>
      <rect x="975" y="60" width="26" height="18" rx="3"/>
      <rect x="975" y="100" width="26" height="18" rx="3"/>
      <rect x="975" y="140" width="26" height="18" rx="3"/>
      <rect x="975" y="180" width="26" height="18" rx="3"/>
      <rect x="975" y="220" width="26" height="18" rx="3"/>
      <rect x="975" y="260" width="26" height="18" rx="3"/>
      <rect x="975" y="300" width="26" height="18" rx="3"/>
      <rect x="1174" y="20" width="26" height="18" rx="3" transform="translate(-40,0)"/>
    </g>
    <g fill="#0b1020" opacity="0.8">
      <rect x="1170" y="20" width="26" height="18" rx="3"/>
      <rect x="1170" y="60" width="26" height="18" rx="3"/>
      <rect x="1170" y="100" width="26" height="18" rx="3"/>
      <rect x="1170" y="140" width="26" height="18" rx="3"/>
      <rect x="1170" y="180" width="26" height="18" rx="3"/>
      <rect x="1170" y="220" width="26" height="18" rx="3"/>
      <rect x="1170" y="260" width="26" height="18" rx="3"/>
      <rect x="1170" y="300" width="26" height="18" rx="3"/>
    </g>
  </g>

  <!-- cascading subtitle bars inside film strip frame -->
  <g>
    <rect x="1015" y="70" width="130" height="14" rx="7" fill="url(#barFade)"/>
    <rect x="1015" y="100" width="95" height="14" rx="7" fill="url(#barFade)" opacity="0.85"/>
    <rect x="1015" y="130" width="115" height="14" rx="7" fill="url(#barFade)" opacity="0.7"/>
    <rect x="1015" y="160" width="70" height="14" rx="7" fill="url(#barFade)" opacity="0.55"/>
    <rect x="1015" y="190" width="105" height="14" rx="7" fill="url(#barFade)" opacity="0.4"/>
    <rect x="1015" y="220" width="60" height="14" rx="7" fill="url(#barFade)" opacity="0.25"/>
  </g>

  <!-- play button glowing circle -->
  <circle cx="1080" cy="150" r="46" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.55"/>
  <polygon points="1068,132 1068,168 1098,150" fill="url(#accent)" opacity="0.9"/>

  <!-- decorative waveform beneath headline -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <polyline points="60,300 90,285 120,300 150,270 180,300 210,290 240,300 270,275 300,300"/>
  </g>

  <!-- download arrow motif, subtle -->
  <g stroke="#37e6d0" stroke-width="3" fill="none" opacity="0.35">
    <line x1="600" y1="40" x2="600" y2="90"/>
    <polyline points="585,75 600,92 615,75"/>
  </g>

  <!-- headline -->
  <text x="60" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#f5f8ff" textLength="640" lengthAdjust="spacingAndGlyphs">
    Subtitle Downloader
  </text>

  <!-- tagline -->
  <text x="60" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#a9b6d8" textLength="1000" lengthAdjust="spacingAndGlyphs">
    Pluggable subtitle downloader for the media player ecosystem
  </text>

  <!-- small accent line under headline -->
  <rect x="62" y="180" width="220" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>

  <!-- floating caption chip -->
  <g>
    <rect x="60" y="240" width="150" height="34" rx="17" fill="#151233" stroke="#37e6d0" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="80" y="263" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#37e6d0">.srt · .vtt · .ass</text>
  </g>
</svg>